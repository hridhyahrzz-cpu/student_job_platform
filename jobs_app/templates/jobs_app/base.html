<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Portal</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Premium Styles -->
    <style>
        :root {
            --bg-gradient-start: #0a0813;
            --bg-gradient-end: #020205;
            --glass-bg: rgba(255, 255, 255, 0.02);
            --glass-border: rgba(255, 255, 255, 0.06);
            --glass-highlight: rgba(255, 255, 255, 0.04);
            --accent-purple: #9d4edd;
            --accent-purple-glow: rgba(157, 78, 221, 0.3);
            --accent-blue: #00b4d8;
            --text-primary: #f8f9fa;
            --text-secondary: #adb5bd;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
            color: var(--text-primary);
            min-height: 100vh;
            background-attachment: fixed;
            overflow-x: hidden;
        }

        /* Glassmorphism elements */
        .card, .glass-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 18px;
            color: var(--text-primary);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .card:hover, .glass-card:hover {
            border-color: rgba(157, 78, 221, 0.2);
            box-shadow: 0 12px 40px 0 rgba(157, 78, 221, 0.12);
            transform: translateY(-2px);
        }

        .card-header {
            background: var(--glass-highlight) !important;
            border-bottom: 1px solid var(--glass-border);
            border-top-left-radius: 18px !important;
            border-top-right-radius: 18px !important;
            padding: 1.25rem 1.5rem;
        }

        /* Custom inputs */
        .form-control, .form-select {
            background: rgba(255, 255, 255, 0.03) !important;
            border: 1px solid var(--glass-border) !important;
            color: var(--text-primary) !important;
            border-radius: 10px !important;
            padding: 0.75rem 1rem !important;
            transition: all 0.3s ease;
        }

        .form-control:focus, .form-select:focus {
            border-color: var(--accent-purple) !important;
            box-shadow: 0 0 10px var(--accent-purple-glow) !important;
            background: rgba(255, 255, 255, 0.06) !important;
        }

        .form-control::placeholder {
            color: rgba(255, 255, 255, 0.3) !important;
        }

        /* Custom labels */
        .form-label {
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
        }

        /* Navbar customization */
        .navbar {
            background: rgba(10, 8, 19, 0.8) !important;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
            padding: 1rem 0;
        }

        .navbar-brand {
            font-weight: 800;
            letter-spacing: -0.03em;
            background: linear-gradient(135deg, var(--text-primary) 30%, var(--accent-purple) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 1.5rem;
        }

        /* Buttons styling */
        .btn {
            border-radius: 10px;
            font-weight: 600;
            padding: 0.6rem 1.4rem;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .btn-primary {
            background: linear-gradient(135deg, #7b2cbf 0%, var(--accent-purple) 100%);
            border: none;
            color: #fff;
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, var(--accent-purple) 0%, #c77dff 100%);
            box-shadow: 0 0 15px var(--accent-purple-glow);
            transform: translateY(-1px);
        }

        .btn-success {
            background: linear-gradient(135deg, #134e4a 0%, #0d9488 100%);
            border: none;
            color: #fff;
        }

        .btn-success:hover {
            background: linear-gradient(135deg, #0d9488 0%, #2dd4bf 100%);
            box-shadow: 0 0 15px rgba(13, 148, 136, 0.35);
            transform: translateY(-1px);
        }

        .btn-warning {
            background: linear-gradient(135deg, #ca8a04 0%, #facc15 100%);
            border: none;
            color: #000 !important;
        }

        .btn-warning:hover {
            background: linear-gradient(135deg, #facc15 0%, #fef08a 100%);
            box-shadow: 0 0 15px rgba(250, 204, 21, 0.35);
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--glass-border);
            color: var(--text-primary);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.12);
            color: var(--text-primary);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .btn-outline-light {
            border: 1px solid var(--glass-border);
        }

        .btn-outline-light:hover {
            background-color: var(--text-primary);
            color: #0a0813 !important;
        }

        /* Typography */
        h1, h2, h3, h4, h5, h6 {
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--text-primary);
        }

        p, li {
            color: var(--text-secondary);
        }

        /* Custom alerts */
        .alert {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--glass-border);
            color: var(--text-primary);
            border-radius: 12px;
            padding: 1rem 1.25rem;
        }

        .alert-danger {
            border-color: rgba(239, 68, 68, 0.2);
            background: rgba(239, 68, 68, 0.06);
            color: #fca5a5;
        }

        .alert-success {
            border-color: rgba(16, 185, 129, 0.2);
            background: rgba(16, 185, 129, 0.06);
            color: #a7f3d0;
        }

        .alert-warning {
            border-color: rgba(245, 158, 11, 0.2);
            background: rgba(245, 158, 11, 0.06);
            color: #fde047;
        }
    </style>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
        <a class="navbar-brand" href="/">JobPortal 🚀</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse justify-content-end" id="navbarContent">
            <div id="navbar-dynamic-links" class="d-flex align-items-center gap-2">
                <!-- Links will be loaded dynamically by script below -->
                <a class="btn btn-outline-light btn-sm" href="/">Home</a>
                <a class="btn btn-outline-light btn-sm" href="/jobs/">Jobs</a>
            </div>
        </div>
    </div>
</nav>

<!-- CONTENT -->
<div class="container my-5">
    {% block content %}
    {% endblock %}
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- Dynamic Authentication State Manager -->
<script>
document.addEventListener('DOMContentLoaded', () => {
    const dynamicLinksContainer = document.getElementById('navbar-dynamic-links');
    const accessToken = localStorage.getItem('access_token');

    if (accessToken) {
        const userType = localStorage.getItem('user_type');
        let links = `
            <a class="btn btn-outline-light btn-sm" href="/">Home</a>
            <a class="btn btn-outline-light btn-sm" href="/jobs/">Jobs</a>
            <a class="btn btn-primary btn-sm" href="/dashboard/">Dashboard</a>
        `;
        if (userType === 'student') {
            links += `
                <a class="btn btn-outline-light btn-sm" href="/my-applications/">My Applications</a>
            `;
        }
        links += `
            <a class="btn btn-outline-light btn-sm" href="/profile/">Profile</a>
            <a class="btn btn-warning btn-sm" href="#" id="logout-link">Logout</a>
        `;
        dynamicLinksContainer.innerHTML = links;

        // Handle Logout Action
        document.getElementById('logout-link').addEventListener('click', (e) => {
            e.preventDefault();
            localStorage.removeItem('access_token');
            localStorage.removeItem('refresh_token');
            localStorage.removeItem('user_type');
            window.location.href = '/logout/';
        });
    } else {
        // Guest Navbar
        dynamicLinksContainer.innerHTML = `
            <a class="btn btn-outline-light btn-sm" href="/">Home</a>
            <a class="btn btn-outline-light btn-sm" href="/jobs/">Jobs</a>
            <a class="btn btn-primary btn-sm" href="/login-page/">Login</a>
            <a class="btn btn-success btn-sm" href="/register-page/">Register</a>
        `;
    }
});
</script>
</body>
</html>
