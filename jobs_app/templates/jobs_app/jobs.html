<!DOCTYPE html>
<html>
<head>
    <title>Jobs</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-5">

    <h1 class="mb-4">Available Jobs</h1>

    {% for job in jobs %}

        <div class="card mb-3">
            <div class="card-body">

                <h4>{{ job.title }}</h4>
                <p>{{ job.description|truncatechars:100 }}</p>

                <a href="/job/{{ job.id }}/" class="btn btn-info">
                    View Details
                </a>

                <a href="/job/{{ job.id }}/apply/" class="btn btn-success">
                    Apply
                </a>

            </div>
        </div>

    {% empty %}
        <p>No jobs available.</p>
    {% endfor %}

</div>

</body>
</html>
