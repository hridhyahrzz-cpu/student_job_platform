{% extends 'jobs_app/base.html' %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 60vh;">
    <div class="col-md-6 text-center">
        <div class="card border-0 shadow-lg p-5">
            <div class="card-body">
                <div class="mb-4">
                    <!-- Nice checkmark icon -->
                    <div class="d-inline-flex align-items-center justify-content-center bg-success bg-opacity-10 text-success rounded-circle p-4 mb-3 border border-success border-opacity-25" style="width: 80px; height: 80px;">
                        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="currentColor" class="bi bi-check-lg" viewBox="0 0 16 16">
                            <path d="M12.736 3.97a.733.733 0 0 1 1.047 0c.286.289.29.756.01 1.05L7.88 12.01a.733.733 0 0 1-1.065.02L3.217 8.384a.757.757 0 0 1 0-1.06.733.733 0 0 1 1.047 0l3.052 3.093 5.4-6.425z"/>
                        </svg>
                    </div>
                    <h2 class="fw-bold mb-2">{{ message }}</h2>
                    <p class="text-secondary small">Your application for <strong>{{ job.title }}</strong> has been registered by the system.</p>
                </div>

                <div class="mb-4 p-3 border border-secondary border-opacity-10 rounded-3 bg-white bg-opacity-5 text-start">
                    <span class="text-secondary small d-block mb-1">Company</span>
                    <span class="fw-semibold text-white d-block mb-2">{{ job.company_name }}</span>
                    <span class="text-secondary small d-block mb-1">Location</span>
                    <span class="fw-semibold text-white d-block">{{ job.location }}</span>
                </div>

                <div class="d-flex justify-content-center gap-3">
                    <a href="/jobs/" class="btn btn-primary px-4">Browse More Jobs</a>
                    <a href="/dashboard/" class="btn btn-secondary px-4">My Dashboard</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
