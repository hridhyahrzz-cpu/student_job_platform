<!DOCTYPE html>
<html>
<head>
    <title>Jobs</title>
</head>
<body>

<nav>
    <a href="/">Home</a> |
    <a href="/jobs/">Jobs</a>
</nav>

<hr>

    <h1>Available Jobs</h1>

    {% for job in jobs %}
        <div style="border:1px solid black; padding:10px; margin:10px;">
            <h2>{{ job.title }}</h2>

            <p>{{ job.description }}</p>

            <a href="/job/{{ job.id }}/">
                View Details
            </a>

            <br><br>

            <a href="/job/{{ job.id }}/apply/">
                Apply Now
            </a>
        </div>
    {% endfor %}

</body>
</html>
